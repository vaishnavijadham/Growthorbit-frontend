<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Result</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:500px;
background:#1e293b;
padding:40px;
border-radius:16px;
text-align:center;
}

.pass{
color:#22c55e;
}

.fail{
color:#ef4444;
}

button{

margin-top:20px;

padding:12px 25px;

border:none;

border-radius:10px;

background:#6366f1;

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<div class="card">

<h1 id="status"></h1>

<h2 id="score"></h2>

<h3 id="correct"></h3>

<button onclick="goDashboard()">

Go To Dashboard

</button>

</div>

<script>

const result =

JSON.parse(

localStorage.getItem(
"resultData"
)

) ||

{
score:0,
correct:0,
total:25
};

console.log(
result
);

document
.getElementById(
"score"
)
.innerText =

`Score: ${result.score}%`;

document
.getElementById(
"correct"
)
.innerText =

`Correct: ${result.correct} / ${result.total}`;

const passed =
result.score>=70;

document
.getElementById(
"status"
)
.innerText =

passed
?
"✅ PASS"
:
"❌ FAIL";

document
.getElementById(
"status"
)
.className =

passed
?
"pass"
:
"fail";

function goDashboard(){

window.location.href =
"./dashboard.html";

}

</script>

</body>

</html>
